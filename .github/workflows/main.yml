name: 🚀 Deploy website on push to prod

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # PHP setup + Composer cache
      # -------------------------------------------------
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: 📦 Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      # -------------------------------------------------
      # Node cache (always restored, cheap & safe)
      # -------------------------------------------------
      - name: 📦 Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # -------------------------------------------------
      # Install backend deps (always)
      # -------------------------------------------------
      - name: ⚙️ Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # -------------------------------------------------
      # Install frontend deps ONLY if FE changed
      # -------------------------------------------------
      - name: ⚙️ Install Node dependencies
        run: npm install

      # -------------------------------------------------
      # Build frontend ONLY if FE changed
      # -------------------------------------------------
      - name: 🧱 Build frontend
        run: npm run build
      #   env:
      #     VITE_MP_CLIENT_ID: ${{ secrets.VITE_MP_CLIENT_ID }}
      #     VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY_STG }}

      # -------------------------------------------------
      # Deploy
      # -------------------------------------------------
      - name: 🚀 Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ vars.TARGET_STG }}
          SSH_PORT: 22022
          EXCLUDE: "/dist/, /node_modules/, /vendor/"
          SCRIPT_AFTER: |
            cd ${{ secrets.TARGET_PROD }}
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate
